<ion-card class="athlete-card">

   <ion-button
    fill="clear"
    class="menu-btn"
    (click)="openMenu($event)">

    <ion-icon
        name="ellipsis-vertical">
    </ion-icon>

    </ion-button>

    <img
        class="photo"
        [src]="athlete.photo || 'assets/avatars/athlete.png'">

    <h2>

        {{ athlete.firstName }}

        {{ athlete.lastName }}

    </h2>

    <span class="category">

        {{ athlete.category }}

    </span>

    <div class="status">

        <span
            class="dot"
            [class.active]="athlete.active">
        </span>

        {{ athlete.active ? 'Activo' : 'Inactivo' }}

    </div>

    <div class="footer">

        <small>

            {{ athlete.club }}

        </small>

    </div>

</ion-card>
