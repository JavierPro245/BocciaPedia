<ion-card class="trainer-card">

  <ion-card-content>

    <div class="menu">

      <ion-button
        fill="clear"
        size="small"
        [id]="'trainer-menu-' + trainer.uid">

        <ion-icon
          name="ellipsis-vertical">
        </ion-icon>

      </ion-button>

      <ion-popover
  #popover
  [trigger]="'trainer-menu-' + trainer.uid"
  side="bottom"
  alignment="end">

        <ng-template>

          <ion-content>

            <ion-list>

              <ion-item
                button
                (click)="viewDetails()">

                <ion-icon
                  slot="start"
                  name="eye-outline">
                </ion-icon>

                Ver perfil

              </ion-item>

              <ion-item
                button
                (click)="editTrainer()">

                <ion-icon
                  slot="start"
                  name="create-outline">
                </ion-icon>

                Editar

              </ion-item>

              <ion-item
                button
                lines="none"
                (click)="deleteTrainer()">

                <ion-icon
                  slot="start"
                  color="danger"
                  name="trash-outline">
                </ion-icon>

                Eliminar

              </ion-item>

            </ion-list>

          </ion-content>

        </ng-template>

      </ion-popover>

    </div>

    <div class="photo">

      <app-user-avatar
    [photoURL]="trainer.photoURL"
    [size]="90">
</app-user-avatar>

    </div>

    <h2>

      {{ trainer.displayName }}

    </h2>

    <ion-chip
      color="primary"
      *ngIf="trainer.roles?.includes('trainer')">

      Entrenador

    </ion-chip>

    <p *ngIf="trainer.trainerProfile?.club">

      {{ trainer.trainerProfile?.club }}

    </p>

    <ion-item lines="none">

      <ion-icon
        slot="start"
        name="mail-outline">
      </ion-icon>

      {{ trainer.email }}

    </ion-item>

    <ion-item
      lines="none"
      *ngIf="trainer.trainerProfile?.phone">

      <ion-icon
        slot="start"
        name="call-outline">
      </ion-icon>

      {{ trainer.trainerProfile?.phone }}

    </ion-item>

  </ion-card-content>

</ion-card>
