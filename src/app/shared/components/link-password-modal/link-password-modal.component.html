<ion-header>

  <ion-toolbar>

    <ion-title>

      Vincular contraseña

    </ion-title>

  </ion-toolbar>

</ion-header>

<ion-content class="ion-padding">

  <ion-item>

    <ion-label position="stacked">

      Correo

    </ion-label>

    <ion-input

      [value]="email"

      readonly>

    </ion-input>

  </ion-item>

  <ion-item>

    <ion-label position="stacked">

      Contraseña

    </ion-label>

    <ion-input

      type="password"

      [(ngModel)]="password">

    </ion-input>

  </ion-item>

  <ion-item>

    <ion-label position="stacked">

      Confirmar contraseña

    </ion-label>

    <ion-input

      type="password"

      [(ngModel)]="confirmPassword">

    </ion-input>

  </ion-item>

</ion-content>

<ion-footer>

  <ion-toolbar>

    <ion-button

      fill="outline"

      (click)="cancel()">

      Cancelar

    </ion-button>

    <ion-button

      (click)="save()">

      Vincular

    </ion-button>

  </ion-toolbar>

</ion-footer>
