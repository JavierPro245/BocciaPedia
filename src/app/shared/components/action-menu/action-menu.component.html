<ion-list>

  <ion-item button (click)="select('detail')">
    <ion-icon slot="start" name="eye-outline"></ion-icon>
    <ion-label>Ver información</ion-label>
  </ion-item>

  <ion-item button (click)="select('edit')">
    <ion-icon slot="start" name="create-outline"></ion-icon>
    <ion-label>Editar</ion-label>
  </ion-item>

  <ion-item button (click)="select('evaluation')">
    <ion-icon slot="start" name="clipboard-outline"></ion-icon>
    <ion-label>Evaluaciones</ion-label>
  </ion-item>

  <ion-item button lines="none" (click)="select('delete')">
    <ion-icon
      slot="start"
      color="danger"
      name="trash-outline">
    </ion-icon>

    <ion-label color="danger">
      Eliminar
    </ion-label>

  </ion-item>

</ion-list>
