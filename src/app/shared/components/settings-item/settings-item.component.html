<ion-item
    button
    detail="true"
    [routerLink]="route">

    <div
        class="icon-badge"
        [class]="'c-' + color"
        slot="start">

        <ion-icon [name]="icon"></ion-icon>

    </div>

    <ion-label>

        <h2>

            {{title}}

        </h2>

        <p *ngIf="subtitle">

            {{subtitle}}

        </p>

    </ion-label>

</ion-item>
