<div
    class="dashboard-card"
    [class.clickable]="route"
    [routerLink]="route">

    <div
        class="icon-badge"
        [class]="'c-' + color">

        <ion-icon [name]="icon"></ion-icon>

    </div>

    <h1>

        {{ value }}

    </h1>

    <h3>

        {{ title }}

    </h3>

    <ion-icon
        *ngIf="route"
        class="chevron"
        name="chevron-forward-outline">
    </ion-icon>

</div>
