<div class="select-group">

    <label
        *ngIf="label"
        class="select-label">

        {{ label }}

    </label>

    <div class="select-container">

        <ion-select

            interface="popover"

            [placeholder]="placeholder"

            [formControl]="control">

            <ion-select-option

                *ngFor="let option of options"

                [value]="option">

                {{ option }}

            </ion-select-option>

        </ion-select>

    </div>

</div>
