<ion-item>

    <ion-label position="stacked">

        {{ label }}

    </ion-label>

    <ion-select

        interface="popover"

        [placeholder]="placeholder"

        [formControl]="control">

        <ion-select-option

            *ngFor="let option of options"

            [value]="option">

            {{ option }}

        </ion-select-option>

    </ion-select>

</ion-item>
