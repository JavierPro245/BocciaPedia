<ion-header class="ion-no-border">

    <ion-toolbar>
      

        <ion-buttons slot="start">
          <ion-menu-button *ngIf="showMenu" menu="menu-content" ></ion-menu-button>
            <ion-button
                *ngIf="showBackButton"
                fill="clear"
                class="back-btn"
                (click)="goBack()">

                <ion-icon
                    slot="icon-only"
                    name="chevron-back-outline">
                </ion-icon>

            </ion-button>

        </ion-buttons>

        <ion-title>

            <ion-icon
                *ngIf="icon"
                [name]="icon">
            </ion-icon>

            {{title}}

            <p *ngIf="subtitle">
                {{subtitle}}
            </p>

        </ion-title>

        <ion-buttons slot="end">

  <ion-button
    *ngIf="showAction"
    fill="clear"
    (click)="onAction()">

    <ion-icon
      slot="icon-only"
      [name]="actionIcon">
    </ion-icon>

  </ion-button>

</ion-buttons>

    </ion-toolbar>

</ion-header>
