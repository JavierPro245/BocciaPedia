<ion-header class="ion-no-border">

    <ion-toolbar>
      

        <ion-buttons slot="start">
          <ion-menu-button *ngIf="showMenu" menu="menu-content" ></ion-menu-button>
            <ion-back-button
                *ngIf="showBackButton"
                defaultHref="/main">
            </ion-back-button>

        </ion-buttons>

        <ion-title>

            <ion-icon
                *ngIf="icon"
                [name]="icon">
            </ion-icon>

            {{title}}

            <p *ngIf="subtitle">
                {{subtitle}}
            </p>

        </ion-title>

    </ion-toolbar>

</ion-header>
