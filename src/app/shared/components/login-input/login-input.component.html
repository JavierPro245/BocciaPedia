<div class="input-group">

    <label
        *ngIf="label"
        class="input-label">

        {{ label }}

    </label>

    <div
        class="input-container"
        [class.invalid]="hasError">

        <ion-icon
            *ngIf="icon"
            class="left-icon"
            [name]="icon">
        </ion-icon>

        <ion-input

            [formControl]="control"

            [type]="inputType"

            [placeholder]="placeholder"

            [maxlength]="maxlength"

            [readonly]="readonly"

            [attr.autocomplete]="autocomplete || null">

        </ion-input>

        <ion-button

            *ngIf="type === 'password'"

            fill="clear"

            class="eye-button"

            [attr.aria-label]="showPassword
                ? 'Ocultar contraseña'
                : 'Mostrar contraseña'"

            (click)="togglePassword()"

            type="button">

            <ion-icon

                slot="icon-only"

                [name]="showPassword
                ? 'eye-off-outline'
                : 'eye-outline'">

            </ion-icon>

        </ion-button>

    </div>

    <small
        class="error-message"
        *ngIf="hasError">

        <ion-icon name="alert-circle"></ion-icon>

        {{ errorMessage }}

    </small>

</div>
