<div class="info-card">

    <div class="info-row">

        <ion-icon name="mail-outline"></ion-icon>

        <div>
            <h3>Correo</h3>
            <p>{{ user.email }}</p>
        </div>

    </div>

    <div class="info-row">

        <ion-icon name="ribbon-outline"></ion-icon>

        <div>
            <h3>Rol</h3>
            <p>{{ role }}</p>
        </div>

    </div>

    <div class="info-row">

        <ion-icon
            [name]="user.active ? 'checkmark-circle-outline' : 'close-circle-outline'"
            [class.ok]="user.active"
            [class.bad]="!user.active">
        </ion-icon>

        <div>
            <h3>Estado</h3>
            <p>{{ user.active ? 'Activa' : 'Desactivada' }}</p>
        </div>

    </div>

    <div class="info-row">

        <ion-icon
            [name]="user.approved ? 'shield-checkmark-outline' : 'time-outline'"
            [class.ok]="user.approved"
            [class.pending]="!user.approved">
        </ion-icon>

        <div>
            <h3>Aprobación</h3>
            <p>{{ user.approved ? 'Aprobado' : 'Pendiente' }}</p>
        </div>

    </div>

    <div class="info-row">

        <ion-icon name="finger-print-outline"></ion-icon>

        <div>
            <h3>UID</h3>
            <p class="uid">{{ user.uid }}</p>
        </div>

    </div>

</div>
