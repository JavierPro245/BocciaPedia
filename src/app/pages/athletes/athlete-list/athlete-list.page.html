<app-header
    [showMenu]="true"
    title="Deportistas">
</app-header>

<ion-content>

    <div class="page-content">

        <ion-searchbar

            placeholder="Buscar deportista"

            animated="true">

        </ion-searchbar>

        <ion-button

            expand="block"

            routerLink="/athletes/athlete-create">

            <ion-icon
                slot="start"
                name="add-circle-outline">
            </ion-icon>

            Nuevo deportista

        </ion-button>

        <app-empty-state

            *ngIf="athletes.length === 0"

            title="No existen deportistas"

            subtitle="Presiona el botón para crear uno nuevo">

        </app-empty-state>

        <div class="grid">

        <app-athlete-card

          *ngFor="let athlete of athletes"

          [athlete]="athlete">

        </app-athlete-card>

        </div>

    </div>

</ion-content>
