<app-header
    [showMenu]="true"
    title="Deportistas">
</app-header>

<ion-content>

    <div class="page-content">

        <ion-searchbar
        placeholder="Buscar deportista..."
        [(ngModel)]="searchText"
        (ionInput)="filterAthletes()"
        debounce="300">
        </ion-searchbar>

        <div class="category-chips">

  <ion-chip
      [outline]="selectedCategory !== ''"
      [color]="selectedCategory === '' ? 'primary' : 'medium'"
      (click)="selectCategory('')">

    <ion-label>Todas</ion-label>

  </ion-chip>

  <ion-chip
      [outline]="selectedCategory !== 'BC1'"
      [color]="selectedCategory === 'BC1' ? 'primary' : 'medium'"
      (click)="selectCategory('BC1')">

    <ion-label>BC1</ion-label>

  </ion-chip>

  <ion-chip
      [outline]="selectedCategory !== 'BC2'"
      [color]="selectedCategory === 'BC2' ? 'primary' : 'medium'"
      (click)="selectCategory('BC2')">

    <ion-label>BC2</ion-label>

  </ion-chip>

  <ion-chip
      [outline]="selectedCategory !== 'BC3'"
      [color]="selectedCategory === 'BC3' ? 'primary' : 'medium'"
      (click)="selectCategory('BC3')">

    <ion-label>BC3</ion-label>

  </ion-chip>

  <ion-chip
      [outline]="selectedCategory !== 'BC4'"
      [color]="selectedCategory === 'BC4' ? 'primary' : 'medium'"
      (click)="selectCategory('BC4')">

    <ion-label>BC4</ion-label>

  </ion-chip>

</div>

        <ion-button

            expand="block"

            routerLink="/athletes/athlete-create">

            <ion-icon
                slot="start"
                name="add-circle-outline">
            </ion-icon>

            Nuevo deportista

        </ion-button>

        <app-empty-state

            *ngIf="athletes.length === 0"

            title="No existen deportistas"

            subtitle="Presiona el botón para crear uno nuevo">

        </app-empty-state>

        <div class="grid">

        <app-athlete-card

            *ngFor="let athlete of filteredAthletes"

            [athlete]="athlete"

            (details)="viewAthlete($event)"

            (edit)="editAthlete($event)"

            (delete)="deleteAthlete($event)"

            (evaluations)="openEvaluations($event)">

        </app-athlete-card>

        </div>

    </div>

</ion-content>
