<app-header
    title="Seleccionar cuenta"
    [showBackButton]="true">
</app-header>

<ion-content class="select-user-content">

    <div class="container">

        <app-empty-state
            *ngIf="users.length === 0"
            icon="people-outline"
            title="No hay cuentas disponibles"
            subtitle="No existen usuarios disponibles para vincular.">
        </app-empty-state>

        <div
            class="ba-row-list"
            *ngIf="users.length > 0">

            <div
                class="ba-row-card"
                *ngFor="let user of users"
                (click)="selectUser(user)">

                <ion-avatar>

                    <img
                        [src]="user.photoURL || 'assets/avatars/user.png'">

                </ion-avatar>

                <div class="ba-row-info">

                    <h2>{{ user.displayName }}</h2>

                    <p>{{ user.email }}</p>

                </div>

                <ion-icon name="chevron-forward-outline"></ion-icon>

            </div>

        </div>

    </div>

</ion-content>
