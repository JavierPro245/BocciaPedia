<app-header
  title="Fotos"
  [showBackButton]="true">
</app-header>

<ion-content>

  <ng-container *ngIf="photos.length > 0; else emptyState">

    <div class="grid">

      <div class="grid-item" *ngFor="let item of photos">

        <ion-img
          [src]="item.url"
          (click)="openPreview(item)">
        </ion-img>

        <ion-button
          *ngIf="canManage"
          class="rename-btn"
          fill="clear"
          (click)="renamePhoto(item)">

          <ion-icon name="pencil-outline" slot="icon-only"></ion-icon>

        </ion-button>

        <ion-button
          *ngIf="canManage"
          class="delete-btn"
          fill="clear"
          color="danger"
          (click)="deletePhoto(item)">

          <ion-icon name="trash-outline" slot="icon-only"></ion-icon>

        </ion-button>

      </div>

    </div>

  </ng-container>

  <ng-template #emptyState>

    <div class="empty">

      <ion-icon name="image-outline"></ion-icon>

      <h2>No hay fotos todavía</h2>

      <p *ngIf="canManage">Presiona el botón + para subir la primera.</p>

    </div>

  </ng-template>

  <ion-fab
    *ngIf="canManage"
    vertical="bottom"
    horizontal="end"
    slot="fixed">

    <ion-fab-button
      color="success"
      [disabled]="uploading"
      (click)="uploadPhoto()">

      <ion-icon name="add"></ion-icon>

    </ion-fab-button>

  </ion-fab>

  <ion-modal
    [isOpen]="previewItem !== null"
    (didDismiss)="closePreview()">

    <ng-template>

      <app-header
        [title]="previewItem?.title || 'Foto'"
        [showAction]="true"
        actionIcon="close"
        (action)="closePreview()">
      </app-header>

      <ion-content class="preview-content" (click)="closePreview()">

        <img *ngIf="previewItem" [src]="previewItem.url" />

      </ion-content>

    </ng-template>

  </ion-modal>

</ion-content>
