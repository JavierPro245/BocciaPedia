<app-header
  title="Reportes"
  [showBackButton]="true">
</app-header>

<ion-content class="reports-content">

  <ion-searchbar
    class="list-search"
    [(ngModel)]="search"
    placeholder="Buscar por deportista o tipo..."
    animated="true">
  </ion-searchbar>

  <ng-container *ngIf="filteredEvaluations.length > 0; else emptyState">

    <div class="report-list">

      <div
        class="report-row"
        *ngFor="let evaluation of filteredEvaluations">

        <div class="report-icon">

          <ion-icon name="document-text-outline"></ion-icon>

        </div>

        <div class="report-info">

          <h2>{{ evaluation.athleteName }}</h2>

          <p>{{ evaluation.evaluationType }} · {{ evaluation.throwList?.length ?? 0 }} lanzamientos</p>

          <span class="report-date">{{ evaluation.date | date:'dd/MM/yyyy' }}</span>

        </div>

        <ion-button
          class="pdf-btn"
          fill="outline"
          size="small"
          [disabled]="generatingId === evaluation.id"
          (click)="downloadPdf(evaluation)">

          <ion-icon
            name="download-outline"
            slot="start">
          </ion-icon>

          PDF

        </ion-button>

      </div>

    </div>

  </ng-container>

  <ng-template #emptyState>

    <app-empty-state
      icon="document-text-outline"
      title="No hay evaluaciones para reportar"
      subtitle="Cuando tengas evaluaciones registradas, vas a poder descargarlas en PDF desde acá.">
    </app-empty-state>

  </ng-template>

</ion-content>
