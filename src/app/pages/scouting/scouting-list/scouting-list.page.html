<app-header
  title="Scouting"
  [showMenu]="true">
</app-header>

<ion-content>

  <ion-searchbar
    class="list-search"
    [(ngModel)]="search"
    placeholder="Buscar por nombre o país..."
    animated="true">
  </ion-searchbar>

  <ng-container *ngIf="filteredReports.length > 0; else emptyState">

    <ion-list class="report-list">

      <ion-item-sliding *ngFor="let report of filteredReports">

        <ion-item button (click)="openReport(report)">

          <ion-icon slot="start" name="flag-outline" color="primary"></ion-icon>

          <ion-label>

            <h2>{{ report.opponentName }}</h2>

            <p>{{ report.opponentCountry }} · {{ report.plays?.length || 0 }} jugadas registradas</p>

          </ion-label>

        </ion-item>

        <ion-item-options side="end">

          <ion-item-option color="danger" (click)="confirmDelete(report)">
            <ion-icon slot="icon-only" name="trash-outline"></ion-icon>
          </ion-item-option>

        </ion-item-options>

      </ion-item-sliding>

    </ion-list>

  </ng-container>

  <ng-template #emptyState>

    <app-empty-state
      icon="flag-outline"
      title="No hay scouting registrado"
      subtitle="Presioná el botón + para registrar el primer rival.">
    </app-empty-state>

  </ng-template>

  <ion-fab vertical="bottom" horizontal="end" slot="fixed">

    <ion-fab-button color="success" (click)="newReport()">
      <ion-icon name="add"></ion-icon>
    </ion-fab-button>

  </ion-fab>

</ion-content>
