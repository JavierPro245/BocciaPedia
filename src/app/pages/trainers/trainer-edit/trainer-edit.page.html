<app-header
    title="Editar entrenador"
    [showBackButton]="true">
</app-header>

<ion-content>

    <div class="page-content" *ngIf="!loading">

        <div class="profile-header">

            <app-user-avatar
                [photoURL]="trainer.photoURL"
                [size]="110">
            </app-user-avatar>

            <h2>{{ trainer.displayName }}</h2>

        </div>

        <form
            [formGroup]="form"
            (ngSubmit)="save()">

            <ion-list inset>

                <ion-item>

                    <ion-label position="stacked">

                        Teléfono

                    </ion-label>

                    <ion-input
                        formControlName="phone"
                        placeholder="+56 9 1234 5678">
                    </ion-input>

                </ion-item>

                <ion-item>

                    <ion-label position="stacked">

                        Club

                    </ion-label>

                    <ion-input
                        formControlName="club"
                        placeholder="Club Deportivo">
                    </ion-input>

                </ion-item>

                <ion-item>

                    <ion-label position="stacked">

                        Federación

                    </ion-label>

                    <ion-input
                        formControlName="federation"
                        placeholder="Federación">
                    </ion-input>

                </ion-item>

                <ion-item>

                    <ion-label position="stacked">

                        Ciudad

                    </ion-label>

                    <ion-input
                        formControlName="city"
                        placeholder="Ciudad">
                    </ion-input>

                </ion-item>

                <ion-item>

                    <ion-label position="stacked">

                        Especialidad

                    </ion-label>

                    <ion-input
                        formControlName="specialization"
                        placeholder="Ej: BC2">
                    </ion-input>

                </ion-item>

            </ion-list>

            <ion-button
                expand="block"
                type="submit"
                [disabled]="saving"
                class="ion-margin-top">

                <ion-spinner
                    *ngIf="saving"
                    slot="start">
                </ion-spinner>

                Guardar cambios

            </ion-button>

        </form>

    </div>

</ion-content>
