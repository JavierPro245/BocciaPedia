<app-header
  title="Nuevo Entrenador"
  [showBackButton]="true">
</app-header>

<ion-content fullscreen class="trainer-create-content">

  <ion-searchbar
    class="list-search"
    placeholder="Buscar usuario..."
    [(ngModel)]="searchText"
    (ionInput)="filterUsers()">
  </ion-searchbar>

  <app-loading
    *ngIf="loading"
    message="Cargando usuarios...">
  </app-loading>

  <app-empty-state
    *ngIf="!loading && filteredUsers.length === 0"
    icon="people-outline"
    title="No hay usuarios disponibles"
    message="Todos los usuarios ya son entrenadores o no existen usuarios registrados.">
  </app-empty-state>

  <div
    class="candidate-list"
    *ngIf="!loading && filteredUsers.length > 0">

    <div
      class="candidate-row"
      *ngFor="let user of filteredUsers">

      <app-user-avatar
        [photoURL]="user.photoURL"
        [size]="48">
      </app-user-avatar>

      <div class="candidate-info">

        <h2>{{ user.displayName }}</h2>

        <p>{{ user.email }}</p>

        <div
          class="chips"
          *ngIf="user.roles.length">

          <ion-chip
            *ngFor="let role of user.roles"
            color="medium">

            <ion-label>

              {{ role }}

            </ion-label>

          </ion-chip>

        </div>

      </div>

      <ion-button
        class="convert-btn"
        size="small"
        color="success"
        (click)="convertToTrainer(user)">

        <ion-icon
          slot="start"
          name="person-add">
        </ion-icon>

        Convertir

      </ion-button>

    </div>

  </div>

</ion-content>
