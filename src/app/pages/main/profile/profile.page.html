<app-header
    [showMenu]="true"
    title="Perfil">
</app-header>

<ion-content>

    <app-profile-avatar

    [image]="user?.photoURL || 'assets/avatars/avatar.png'"

    [name]="user?.displayName || ''"

    [role]="role"

    [online]="user?.active ?? false"

    [editable]="true"

    (photoChange)="changePhoto()">

    </app-profile-avatar>

    <ion-card>

  <ion-card-header>

    <ion-card-title>

      Seguridad

    </ion-card-title>

  </ion-card-header>

  <ion-card-content>

    <ion-item>

      <ion-icon
        slot="start"
        name="logo-google"
        color="danger">
      </ion-icon>

      <ion-label>

        Google

      </ion-label>

      <ion-badge
        [color]="hasGoogle ? 'success' : 'medium'">

        {{ hasGoogle ? 'Vinculado' : 'No vinculado' }}

      </ion-badge>

    </ion-item>

    <ion-item>

      <ion-icon
        slot="start"
        name="mail"
        color="primary">
      </ion-icon>

      <ion-label>

        Correo y contraseña

      </ion-label>

      <ion-badge
        [color]="hasPassword ? 'success' : 'medium'">

        {{ hasPassword ? 'Vinculado' : 'No vinculado' }}

      </ion-badge>

    </ion-item>

    <ion-button
      *ngIf="!hasPassword"
      expand="block"
      color="primary"
      (click)="linkPassword()">

      Agregar contraseña

    </ion-button>

  </ion-card-content>

</ion-card>

<ion-card
    *ngIf="isAdmin()"
    class="app-card">

    <ion-card-content>

        Esta cuenta es Administrador.

    </ion-card-content>

</ion-card>

</ion-content>
