<app-header
    [showMenu]="true"
    title="Perfil">
</app-header>

<ion-content>

    <app-profile-avatar

    [image]="user?.photoURL || 'assets/avatars/avatar.png'"

    [name]="user?.displayName || ''"

    [role]="role"

    [online]="user?.active ?? false"

    [editable]="true"

    (photoChange)="changePhoto()">

    </app-profile-avatar>

<ion-card
    *ngIf="isAdmin()"
    class="app-card">

    <ion-card-content>

        Esta cuenta es Administrador.

    </ion-card-content>

</ion-card>

</ion-content>
