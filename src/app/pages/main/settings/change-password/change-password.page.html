<app-header
  [showBackButton]="true"
  title="Cambiar contraseña">
</app-header>

<ion-content class="ion-padding">

  <ng-container *ngIf="hasPasswordProvider; else noPassword">

    <form
      class="auth-form"
      [formGroup]="form"
      (ngSubmit)="submit()">

      <app-login-input
        label="Contraseña actual"
        placeholder="Ingrese su contraseña actual"
        icon="lock-closed-outline"
        type="password"
        [control]="form.controls.currentPassword">
      </app-login-input>

      <app-login-input
        label="Nueva contraseña"
        placeholder="Mínimo 6 caracteres"
        icon="key-outline"
        type="password"
        [control]="form.controls.newPassword">
      </app-login-input>

      <app-login-input
        label="Confirmar nueva contraseña"
        placeholder="Repita la nueva contraseña"
        icon="key-outline"
        type="password"
        [control]="form.controls.confirmPassword">
      </app-login-input>

      <ion-button
        expand="block"
        type="submit"
        color="primary"
        class="submit"
        [disabled]="form.invalid || saving">

        {{ saving ? 'Guardando...' : 'Guardar cambios' }}

      </ion-button>

    </form>

  </ng-container>

  <ng-template #noPassword>

    <div class="empty">

      <ion-icon name="key-outline"></ion-icon>

      <h2>Todavía no tienes una contraseña</h2>

      <p>Tu cuenta usa Google para iniciar sesión. Puedes vincular una contraseña desde tu perfil.</p>

      <ion-button routerLink="/main/profile" fill="outline">
        Ir a mi perfil
      </ion-button>

    </div>

  </ng-template>

</ion-content>
