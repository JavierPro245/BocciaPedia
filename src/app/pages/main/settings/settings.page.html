<app-header
    [showMenu]="true"
    title="Configuración">
</app-header>

<ion-content class="ion-padding">

    <h3>Usuario</h3>

    <app-settings-item
        icon="person-outline"
        title="Mi perfil"
        subtitle="Editar información personal"
        route="/main/profile">
    </app-settings-item>

    <app-settings-item
        icon="lock-closed-outline"
        title="Cambiar contraseña"
        subtitle="Actualizar credenciales"
        route="/main/settings/change-password">
    </app-settings-item>

    <h3>Competencia</h3>

    <app-settings-item
        icon="trophy-outline"
        title="Categorías"
        subtitle="Administrar categorías"
        route="">
    </app-settings-item>

    <app-settings-item
        icon="clipboard-outline"
        title="Evaluaciones"
        subtitle="Configuración general"
        route="">
    </app-settings-item>

    <h3>Datos</h3>

    <app-settings-item
        icon="cloud-upload-outline"
        title="Respaldos"
        subtitle="Exportar e importar información"
        route="">
    </app-settings-item>

    <h3>Apariencia</h3>

    <ion-item class="app-card" lines="none">

        <ion-icon
            slot="start"
            name="moon-outline"
            color="primary">
        </ion-icon>

        <ion-label>

            <h2>Modo oscuro</h2>

            <p>Cambia la apariencia de la aplicación</p>

        </ion-label>

        <ion-toggle
            slot="end"
            [checked]="darkMode"
            (ionChange)="toggleDarkMode($event.detail.checked)">
        </ion-toggle>

    </ion-item>

    <h3>Información</h3>

    <app-settings-item
        icon="information-circle-outline"
        title="Acerca de BocciApp"
        [subtitle]="'Versión ' + appVersion"
        route="">
    </app-settings-item>

</ion-content>
