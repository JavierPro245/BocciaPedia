<app-header
  [showMenu]="true"
  subtitle="Panel Principal">
</app-header>

<ion-content class="ion-padding">

  <!-- Bienvenida -->

  <div class="welcome-card">

    <h2>¡Bienvenido!</h2>

    <p>
      Sistema de Gestión y Análisis de Boccia
    </p>

  </div>

  <!-- Tarjetas -->

  <div class="dashboard-grid">

    <app-dashboard-card
      icon="people-outline"
      title="Deportistas"
      [value]="athleteCount"
      route="/main/athlete-list">
    </app-dashboard-card>

    <app-dashboard-card
      icon="clipboard-outline"
      title="Evaluaciones"
      [value]="0"
      route="/evaluations/evaluations-list">
    </app-dashboard-card>

    <app-dashboard-card
      icon="analytics-outline"
      title="Estadísticas"
      [value]="0"
      route="/dashboard">
    </app-dashboard-card>

    <app-dashboard-card
      icon="trophy-outline"
      title="Partidos"
      [value]="0"
      route="/matches/match-create">
    </app-dashboard-card>

  </div>

  <!-- Accesos rápidos -->

  <h2 class="section-title">

    Accesos rápidos

  </h2>

  <ion-list>

    <ion-item
      button
      routerLink="/athlete-create">

      <ion-icon
        slot="start"
        name="person-add-outline">
      </ion-icon>

      <ion-label>

        Nuevo Deportista

      </ion-label>

    </ion-item>

    <ion-item
      button
      routerLink="/evaluations-create">

      <ion-icon
        slot="start"
        name="clipboard-outline">
      </ion-icon>

      <ion-label>

        Nueva Evaluación

      </ion-label>

    </ion-item>

    <ion-item
      button
      routerLink="/dashboard">

      <ion-icon
        slot="start"
        name="bar-chart-outline">
      </ion-icon>

      <ion-label>

        Dashboard

      </ion-label>

    </ion-item>

    <ion-item
      button
      routerLink="/reports">

      <ion-icon
        slot="start"
        name="document-text-outline">
      </ion-icon>

      <ion-label>

        Reportes

      </ion-label>

    </ion-item>

  </ion-list>

</ion-content>
