<ion-content class="auth-content" [fullscreen]="true">

    <div class="auth-shell has-back">

        <ion-button
            class="auth-back"
            fill="clear"
            mode="ios"
            aria-label="Volver"
            routerLink="/auth">

            <ion-icon
                slot="icon-only"
                name="chevron-back-outline">
            </ion-icon>

        </ion-button>

        <form
            class="auth-card auth-anim"
            [formGroup]="form"
            (ngSubmit)="submit()">

            <div class="auth-badge">

                <ion-icon name="key-outline"></ion-icon>

            </div>

            <div class="recover-intro">

                <h1 class="auth-heading">

                    Recuperar contraseña

                </h1>

                <p class="auth-sub">

                    Ingresa el correo asociado a tu cuenta y te enviaremos un
                    enlace para restablecer tu contraseña.

                </p>

            </div>

            <app-login-input
                label="Correo electrónico"
                placeholder="correo@bocciapp.cl"
                icon="mail-outline"
                type="email"
                autocomplete="email"
                [control]="form.controls.email">
            </app-login-input>

            <ion-button
                expand="block"
                type="submit"
                mode="ios"
                class="auth-cta"
                [disabled]="form.invalid || sending">

                <ion-spinner
                    *ngIf="sending"
                    slot="start"
                    name="crescent">
                </ion-spinner>

                {{ sending ? 'Enviando...' : 'Enviar enlace' }}

            </ion-button>

            <p class="auth-hint">

                <ion-icon name="information-circle-outline"></ion-icon>

                Revisa también tu carpeta de spam si no ves el correo.

            </p>

            <p class="auth-footer">

                <span>

                    ¿Recordaste tu contraseña?

                </span>

                <a
                    class="auth-link"
                    routerLink="/auth">

                    Iniciar sesión

                </a>

            </p>

        </form>

    </div>

</ion-content>
