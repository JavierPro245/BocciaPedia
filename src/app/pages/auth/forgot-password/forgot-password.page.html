<app-header
    [showBackButton]="true"
    title="Recuperar contraseña">
</app-header>

<ion-content>

    <form
        class="auth-form"
        [formGroup]="form"
        (ngSubmit)="submit()">

        <app-logo></app-logo>

        <h2 class="title">

            Recuperar contraseña

        </h2>

        <p class="subtitle">

            Ingresa el correo asociado a tu cuenta y te enviaremos un enlace para restablecer tu contraseña.

        </p>

        <app-login-input

            label="Correo electrónico"

            placeholder="correo@bocciapp.cl"

            icon="mail-outline"

            type="email"

            [control]="form.controls.email">

        </app-login-input>

        <ion-button

            expand="block"

            type="submit"

            color="primary"

            class="submit"

            [disabled]="form.invalid">

            Enviar enlace

        </ion-button>

        <div class="login-link">

            <span>

                ¿Recordaste tu contraseña?

            </span>

            <a routerLink="/auth">

                Iniciar sesión

            </a>

        </div>

    </form>

</ion-content>
