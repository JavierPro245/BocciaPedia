<ion-content class="auth-content" [fullscreen]="true">

    <div class="auth-shell">

        <form
            class="auth-card auth-anim"
            [formGroup]="form"
            (ngSubmit)="submit()">

            <!-- Marca -->

            <app-logo></app-logo>

            <!-- Correo -->

            <app-login-input
                label="Correo electrónico"
                placeholder="correo@bocciapp.cl"
                icon="mail-outline"
                type="email"
                autocomplete="email"
                [control]="form.controls.email">
            </app-login-input>

            <!-- Contraseña -->

            <app-login-input
                label="Contraseña"
                placeholder="Ingrese su contraseña"
                icon="lock-closed-outline"
                type="password"
                autocomplete="current-password"
                [control]="form.controls.password">
            </app-login-input>

            <!-- Recuperar contraseña -->

            <div class="auth-forgot">

                <a
                    class="auth-link"
                    routerLink="/auth/forgot-password">

                    ¿Olvidaste tu contraseña?

                </a>

            </div>

            <!-- Botón Login -->

            <ion-button
                expand="block"
                type="submit"
                mode="ios"
                class="auth-cta"
                [disabled]="form.invalid">

                Ingresar

            </ion-button>

            <!-- Separador -->

            <div class="auth-divider">

                o

            </div>

            <!-- Google -->

            <ion-button
                expand="block"
                type="button"
                mode="ios"
                class="auth-ghost auth-google"
                (click)="loginGoogle()">

                <ion-icon
                    slot="start"
                    name="logo-google">
                </ion-icon>

                Continuar con Google

            </ion-button>

            <!-- Registro -->

            <p class="auth-footer">

                <span>

                    ¿No tienes una cuenta?

                </span>

                <a
                    class="auth-link"
                    routerLink="/auth/sign-up">

                    Regístrate

                </a>

            </p>

        </form>

    </div>

</ion-content>
