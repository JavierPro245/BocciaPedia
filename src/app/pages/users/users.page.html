<app-header
    [showMenu]="true"
    title="Usuarios">
</app-header>

<ion-content class="users-content">

    <app-loading
        *ngIf="loading"
        message="Cargando usuarios...">
    </app-loading>

    <app-empty-state
        *ngIf="!loading && users.length === 0"
        icon="people-outline"
        title="No hay usuarios"
        subtitle="Todavía no se registró ningún usuario.">
    </app-empty-state>

    <div
        class="ba-row-list"
        *ngIf="!loading && users.length > 0">

        <div
            class="ba-row-card"
            *ngFor="let user of users"
            [routerLink]="[user.uid]">

            <app-user-avatar
                [photoURL]="user.photoURL"
                [size]="50">
            </app-user-avatar>

            <div class="ba-row-info">

                <h2>{{ user.displayName }}</h2>

                <p>{{ user.email }}</p>

                <span class="role-text">{{ getRole(user) }}</span>

            </div>

            <ion-badge
                class="status-badge"
                color="success"
                *ngIf="user.approved">

                Aprobado

            </ion-badge>

            <ion-badge
                class="status-badge"
                color="warning"
                *ngIf="!user.approved">

                Pendiente

            </ion-badge>

            <ion-icon name="chevron-forward-outline"></ion-icon>

        </div>

    </div>

</ion-content>
