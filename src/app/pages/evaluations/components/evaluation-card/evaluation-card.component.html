<ion-card
  class="evaluation-card"
  button
  (click)="openEvaluation()">

  <ion-card-content>

    <div class="card">

      <!-- Icono -->

      <div
        class="icon"
        [ngClass]="getColorClass()">

        <ion-icon
          [name]="getIcon()">
        </ion-icon>

      </div>

      <!-- Información -->

      <div class="info">

        <div class="title-row">

          <div>

            <h2>

              {{ evaluation.title || evaluation.evaluationType }}

            </h2>

            <p
              class="evaluation-type"
              *ngIf="evaluation.title">

              {{ evaluation.evaluationType }}

            </p>

          </div>

          <ion-badge>

            {{ evaluation.category || 'BC3' }}

          </ion-badge>

        </div>

        <div class="athlete">

          {{ evaluation.athleteName }}

        </div>

        <div class="details">

          <span>

            🎯 {{ evaluation.throws }}

          </span>

          <span>

            📏 {{ evaluation.distance }} m

          </span>

          <span>

            📅 {{ evaluation.date | date:'dd/MM/yyyy' }}

          </span>

        </div>

      </div>

      <!-- Acciones -->

      <ion-button
  *ngIf="canManage"
  fill="clear"
  color="medium"
  (click)="showMenu($event)">

  <ion-icon
    slot="icon-only"
    name="ellipsis-vertical">
  </ion-icon>

</ion-button>

      <!-- Flecha -->

      <ion-icon
        class="arrow"
        name="chevron-forward">
      </ion-icon>

    </div>

  </ion-card-content>

</ion-card>
