<app-header
    [showBackButton]="true"
    title="Evaluacion">
</app-header>

<ion-content>

  <div class="container">

    <ion-card class="athlete-card">

  <ion-card-content>

    <h2 class="athlete-name">

      {{ athlete }}

    </h2>

    <div class="chips">

      <ion-chip color="light">

        <ion-label>

          {{ category }}

        </ion-label>

      </ion-chip>

      <ion-chip color="primary">

        <ion-icon name="flag-outline"></ion-icon>

        <ion-label>

          {{ evaluation }}

        </ion-label>

      </ion-chip>

      <ion-chip color="success">

        <ion-icon name="resize-outline"></ion-icon>

        <ion-label>

          {{ distance }} m

        </ion-label>

      </ion-chip>

      <ion-chip
      *ngIf="selectedBox !== 'No seleccionado'"
      color="warning">

        <ion-icon name="cube-outline"></ion-icon>

        <ion-label>

          {{ selectedBox }}

        </ion-label>

      </ion-chip>

    </div>

  </ion-card-content>

</ion-card>

    <ion-card>

      <ion-card-content>

        <div class="throw-header">

          <span>Lanzamiento</span>

          <strong>{{ currentThrow }} / {{ totalThrows }}</strong>

        </div>

        <ion-progress-bar
        [value]="progress">
        </ion-progress-bar>

      </ion-card-content>

    </ion-card>

   <ion-card class="assistant-card">

  <ion-card-content>

    <div class="assistant-status">

      <div>

        <ion-icon
        color="success"
        [name]="isBoxCompleted ? 'checkmark-circle' : 'ellipse-outline'">
        </ion-icon>

        <span>

          Box

        </span>

      </div>

      <div>

        <ion-icon
        color="success"
        [name]="isJackCompleted ? 'checkmark-circle' : 'ellipse-outline'">
        </ion-icon>

        <span>

          Jack

        </span>

      </div>

      <div>

        <ion-badge color="primary">

          {{currentThrow+1}}

        </ion-badge>

        <span>

          Lanzamientos

        </span>

      </div>

    </div>

    <p class="instruction">

      {{ instruction }}

    </p>

  </ion-card-content>

</ion-card>
    <ion-card class="court-card">

      <ion-card-content>

        <app-court-engine

        #courtEngine

        [throws]="throws"

        [ballColor]="ballColor"

        [locked]="evaluationFinished || lockCourt"

        (courtSelection)="onSelection($event)"

        (jackPending)="onJackPending($event)"

        (throwRegistered)="onThrowRegistered($event)">

        </app-court-engine>

        <ion-card
        *ngIf="showJackConfirmation"
        class="jack-confirm-card">

  <ion-card-content>

    <h2>📍 Confirmar Jack</h2>

    <p>

      ¿La posición del Jack es correcta?

    </p>

    <div class="bottom-buttons">

      <ion-button
        expand="block"
        fill="outline"
        color="medium"
        (click)="repositionJack()">

        Reubicar

      </ion-button>

      <ion-button
        expand="block"
        color="success"
        (click)="confirmJack()">

        Confirmar

        </ion-button>

        </div>

        </ion-card-content>

        </ion-card>

        <ion-segment
        [(ngModel)]="ballColor">

          <ion-segment-button
          value="red">

          Roja

          </ion-segment-button>

          <ion-segment-button
          value="blue">

          Azul

          </ion-segment-button>

        </ion-segment>

      </ion-card-content>

    </ion-card>

    <div class="bottom-buttons">

      <ion-button
          expand="block"
          color="medium">

        Cancelar

      </ion-button>

      <ion-button
      expand="block"
      [disabled]="!evaluationFinished"
      (click)="finishEvaluation()">

        Ver resumen

      </ion-button>

    </div>

  </div>

  <ion-modal
  [isOpen]="showThrowModal"
  [initialBreakpoint]="0.9"
  [breakpoints]="[0,0.9]"
  [backdropDismiss]="false"
  [handle]="true">

  <ng-template>

    <app-throw-result-modal
    [throwNumber]="currentThrow"
    (save)="saveThrowEvaluation($event)"
    (reposition)="repositionThrow()">
    </app-throw-result-modal>

  </ng-template>

</ion-modal>

</ion-content>
