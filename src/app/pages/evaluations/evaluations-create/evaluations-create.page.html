<app-header
title="Nueva Evaluación"
[showBackButton]="true">
</app-header>

<ion-content>

<ion-card>

<ion-card-content>

<ion-item>

<ion-label position="stacked">

Deportista

</ion-label>

<ion-select
[(ngModel)]="config.athleteId">

<ion-select-option
*ngFor="let athlete of athletes"
[value]="athlete.id">

{{athlete.fullName}}

</ion-select-option>

</ion-select>

</ion-item>

<ion-item>

<ion-label position="stacked">

Tipo evaluación

</ion-label>

<ion-select
[(ngModel)]="config.evaluationType">

<ion-select-option
*ngFor="let evaluation of evaluations"
[value]="evaluation">

{{evaluation}}

</ion-select-option>

</ion-select>

</ion-item>

<ion-item>

<ion-label>

Lanzamientos

</ion-label>

<ion-buttons slot="end">

<ion-button
(click)="decreaseThrows()">

-

</ion-button>

<ion-label>

{{config.throws}}

</ion-label>

<ion-button
(click)="increaseThrows()">

+

</ion-button>

</ion-buttons>

</ion-item>

<ion-item>

  <ion-label position="stacked">

    Distancia (metros)

  </ion-label>

  <ion-input

    type="number"

    inputmode="decimal"

    fill="outline"

    placeholder="Ingrese la distancia"

    [(ngModel)]="config.distance">

  </ion-input>

</ion-item>

<ion-item>

<ion-label
position="stacked">

Observaciones

</ion-label>

<ion-textarea
[(ngModel)]="config.notes">

</ion-textarea>

</ion-item>

<ion-button
  expand="block"
  [disabled]="!config.athleteId"
  (click)="continue()">

  Continuar

</ion-button>

</ion-card-content>

</ion-card>

</ion-content>
