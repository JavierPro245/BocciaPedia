<app-header
  [showBackButton]="true"
  title="HeatMap">
</app-header>

<ion-content>

  <div class="container">

    <ion-card class="filters-card">

  <ion-card-content>

    <div class="filter-group">

      <div class="filter-title">

        Vista

      </div>

      <div class="chips">

        <ion-chip
          [outline]="viewMode !== 'all'"
          [color]="viewMode === 'all' ? 'primary' : 'medium'"
          (click)="setViewMode('all')">

          <ion-icon name="apps"></ion-icon>

          <ion-label>

            Todos juntos

          </ion-label>

        </ion-chip>

        <ion-chip
          [outline]="viewMode !== 'one-by-one'"
          [color]="viewMode === 'one-by-one' ? 'primary' : 'medium'"
          (click)="setViewMode('one-by-one')">

          <ion-icon name="play-skip-forward"></ion-icon>

          <ion-label>

            De a uno

          </ion-label>

        </ion-chip>

      </div>

    </div>

    <div class="filter-group" *ngIf="viewMode === 'one-by-one'">

      <div class="stepper">

        <ion-button
          fill="clear"
          [disabled]="currentIndex === 0"
          (click)="previousThrow()">

          <ion-icon name="chevron-back" slot="icon-only"></ion-icon>

        </ion-button>

        <span class="stepper-label">

          Lanzamiento {{ allThrows.length ? currentIndex + 1 : 0 }} de {{ allThrows.length }}

        </span>

        <ion-button
          fill="clear"
          [disabled]="currentIndex >= allThrows.length - 1"
          (click)="nextThrow()">

          <ion-icon name="chevron-forward" slot="icon-only"></ion-icon>

        </ion-button>

      </div>

      <p class="distance-label" *ngIf="currentDistanceLabel">

        📏 Distancia al jack: <strong>{{ currentDistanceLabel }}</strong>

      </p>

    </div>

    <div class="filter-group" *ngIf="viewMode === 'all'">

      <div class="filter-title">

        Modo de análisis

      </div>

      <div class="chips">

        <ion-chip
          [outline]="heatMode !== 'density'"
          [color]="heatMode === 'density' ? 'primary' : 'medium'"
          (click)="selectHeatMode('density')">

          <ion-icon name="flame"></ion-icon>

          <ion-label>

            Concentración

          </ion-label>

        </ion-chip>

        <ion-chip
          [outline]="heatMode !== 'quality'"
          [color]="heatMode === 'quality' ? 'success' : 'medium'"
          (click)="selectHeatMode('quality')">

          <ion-icon name="ribbon"></ion-icon>

          <ion-label>

            Calidad

          </ion-label>

        </ion-chip>

        <ion-chip
          [outline]="heatMode !== 'precision'"
          [color]="heatMode === 'precision' ? 'warning' : 'medium'"
          (click)="selectHeatMode('precision')">

          <ion-icon name="locate"></ion-icon>

          <ion-label>

            Precisión

          </ion-label>

        </ion-chip>

      </div>

    </div>

    <div class="filter-group" *ngIf="viewMode === 'all'">

      <div class="filter-title">

        Mostrar

      </div>

      <div class="chips">

        <ion-chip
          [outline]="filter !== 'all'"
          [color]="filter === 'all' ? 'primary' : 'medium'"
          (click)="selectFilter('all')">

          <ion-label>

            Todas

          </ion-label>

        </ion-chip>

        <ion-chip
          [outline]="filter !== 'red'"
          [color]="filter === 'red' ? 'danger' : 'medium'"
          (click)="selectFilter('red')">

          <ion-icon name="ellipse"></ion-icon>

          <ion-label>

            Rojas

          </ion-label>

        </ion-chip>

        <ion-chip
          [outline]="filter !== 'blue'"
          [color]="filter === 'blue' ? 'primary' : 'medium'"
          (click)="selectFilter('blue')">

          <ion-icon name="ellipse"></ion-icon>

          <ion-label>

            Azules

          </ion-label>

        </ion-chip>

      </div>

    </div>

  </ion-card-content>

</ion-card>

    <ion-card class="court-card">

  <ion-card-content class="court-content">

    <canvas
      #courtCanvas>
    </canvas>

    <div class="legend-overlay" *ngIf="viewMode === 'all'">

      <div class="legend-item">

        <span class="dot green"></span>

        Excelente

      </div>

      <div class="legend-item">

        <span class="dot blue"></span>

        Buena

      </div>

      <div class="legend-item">

        <span class="dot yellow"></span>

        Regular

      </div>

      <div class="legend-item">

        <span class="dot red"></span>

        Baja

      </div>

    </div>

  </ion-card-content>

</ion-card>

  </div>

</ion-content>
